networks:
  aponti-net:
    driver: overlay
    driver_opts:
      encrypted: "true"

volumes:
  postgres_data:

services:

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=aponti_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
    networks:
      - aponti-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.50'     
          memory: 512M     
        reservations:
          cpus: '0.25'     
          memory: 256M    

  inventory-service:
    image: inventory-service:1.0
    environment:
      - PORT=3002
    networks:
      - aponti-net
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          cpus: '0.50'     
          memory: 512M     
        reservations:
          cpus: '0.25'     
          memory: 256M    

  product-service:
    image: product-service:1.0
    environment:
      - PORT=3001
    networks:
      - aponti-net
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          cpus: '0.50'     
          memory: 512M     
        reservations:
          cpus: '0.25'     
          memory: 256M    

  order-service:
    image: order-service:1.0
    environment:
      - PORT=3003
    networks:
      - aponti-net
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          cpus: '0.50'     
          memory: 512M     
        reservations:
          cpus: '0.25'    
          memory: 256M    

  api-gateway:
    image: api-gateway:1.0
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PRODUCT_SERVICE_URL=http://product-service:3001
      - INVENTORY_SERVICE_URL=http://inventory-service:3002
      - ORDER_SERVICE_URL=http://order-service:3003
    networks:
      - aponti-net
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '0.30'    
          memory: 256M     
        reservations:
          cpus: '0.10'     
          memory: 256M    