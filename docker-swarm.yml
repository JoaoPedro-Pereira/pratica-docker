services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=aponti_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - aponti-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager